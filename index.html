<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Holi Wishes</title>

<style>
body {
  margin:0;
  padding:0;
  text-align:center;
  font-family:Arial, sans-serif;
  background:linear-gradient(45deg,#ff0080,#ff8c00,#40e0d0,#ff0080);
  background-size:400% 400%;
  animation:bg 10s infinite alternate;
  color:white;
}

@keyframes bg {
  0%{background-position:left;}
  100%{background-position:right;}
}

h1{
  margin-top:40px;
  font-size:35px;
  text-shadow:2px 2px 5px black;
}

input{
  padding:10px;
  font-size:18px;
  border-radius:5px;
  border:none;
}

button{
  padding:10px 20px;
  margin:8px;
  border:none;
  border-radius:5px;
  font-size:16px;
  cursor:pointer;
}

.share-btn{
  color:white;
}

#fireworks{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
</style>
</head>

<body>

<h1 id="wishText">🌈 Happy Holi 🎉</h1>

<input type="text" id="nameInput" placeholder="Enter Your Name">
<br>
<button onclick="generateWish()">Generate Wish</button>

<h3 id="visitorCount"></h3>

<div style="margin-top:30px;">
<h2>Share This Holi Wish 🎉</h2>

<a id="whatsappShare" target="_blank">
<button class="share-btn" style="background:#25D366;">WhatsApp</button>
</a>

<a id="facebookShare" target="_blank">
<button class="share-btn" style="background:#1877F2;">Facebook</button>
</a>

<button onclick="copyLink()" class="share-btn" style="background:#E1306C;">
Instagram (Copy Link)
</button>
</div>

<canvas id="fireworks"></canvas>

<audio id="bgMusic" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8f5b0e0e7e.mp3?filename=indian-dhol-110363.mp3" type="audio/mp3">
</audio>

<script>

/* 🔥 AUTO NAME FROM URL */
window.onload=function(){
  const params=new URLSearchParams(window.location.search);
  const name=params.get("name");
  if(name){
    document.getElementById("wishText").innerHTML=
    "🌈 Happy Holi from "+name+" 🎉";
  }
};

/* Generate Wish + Create Viral Link */
function generateWish(){
  var name=document.getElementById("nameInput").value;
  if(name!=""){
    document.getElementById("wishText").innerHTML=
    "🌈 Happy Holi from "+name+" 🎉";

    var newURL=window.location.origin+
    window.location.pathname+
    "?name="+encodeURIComponent(name);

    window.history.replaceState({},'',newURL);
  }
}

/* Visitor Counter */
if(localStorage.visits){
  localStorage.visits = Number(localStorage.visits)+1;
}else{
  localStorage.visits = 1;
}
document.getElementById("visitorCount").innerHTML=
"Total Visitors: "+localStorage.visits;

/* Share Links (Auto Viral Link) */
function updateShareLinks(){
  var pageUrl=window.location.href;
  var message="🌈 Happy Holi! 🎉 See this special wish: "+pageUrl;

  document.getElementById("whatsappShare").href=
  "https://wa.me/?text="+encodeURIComponent(message);

  document.getElementById("facebookShare").href=
  "https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(pageUrl);
}

updateShareLinks();

function copyLink(){
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied! Paste on Instagram Story or Bio.");
}

/* Music */
document.addEventListener("click",function(){
  document.getElementById("bgMusic").play();
});

/* Fireworks */
var canvas=document.getElementById("fireworks");
var ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function firework(){
  var x=Math.random()*canvas.width;
  var y=Math.random()*canvas.height/2;
  for(var i=0;i<30;i++){
    ctx.beginPath();
    ctx.arc(x+Math.random()*100-50,y+Math.random()*100-50,3,0,Math.PI*2);
    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fill();
  }
}
setInterval(firework,800);

</script>

</body>
</html>
