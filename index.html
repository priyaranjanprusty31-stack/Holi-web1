<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Holi 2026 | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --p1: #FF007A; --p2: #00D4FF; --p3: #FFD700;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Poppins', sans-serif;
            background: #0f0c29;
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: white;
        }

        /* Animated Background Pot */
        .pot-container {
            position: absolute; top: 10%; font-size: 5rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--p1));
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }

        .card {
            position: relative; z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 40px;
            width: 90%; max-width: 420px; text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2.8rem; margin: 0; font-weight: 800;
            background: linear-gradient(45deg, var(--p1), var(--p2), var(--p3));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .wish-text { font-size: 1.1rem; opacity: 0.9; margin: 15px 0; font-weight: 300; }

        input {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            background: rgba(255,255,255,0.15); color: white;
            font-size: 1rem; margin-bottom: 20px; outline: none;
        }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            padding: 15px; border-radius: 15px; border: none; cursor: pointer;
            font-weight: 600; transition: 0.3s; font-size: 1rem;
        }

        .btn-splash {
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            color: white; box-shadow: 0 10px 20px rgba(255, 0, 204, 0.3);
        }

        .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        
        .s-btn {
            padding: 10px; border-radius: 12px; text-decoration: none;
            color: white; font-size: 0.8rem; font-weight: bold;
        }
        .wa { background: #25D366; } .fb { background: #1877F2; } .copy { background: #444; grid-column: span 2; }

        .s-btn:hover { transform: translateY(-3px); filter: brightness(1.2); }
    </style>
</head>
<body>

    <div class="pot-container">🏺</div>

    <div class="card">
        <h1 id="title">Happy Holi!</h1>
        <div id="nameHeading" style="font-size: 1.5rem; color: var(--p3); margin-top: 5px;">Friend</div>
        <p class="wish-text">Sprinkling some digital colors of joy and prosperity your way!</p>

        <input type="text" id="nameInput" placeholder="Enter name to share...">

        <div class="btn-group">
            <button class="btn btn-splash" onclick="celebrate()">Launch Color Blast! 🎆</button>
            <div class="share-grid">
                <a href="#" id="wa" class="s-btn wa" target="_blank">WhatsApp</a>
                <a href="#" id="fb" class="s-btn fb" target="_blank">Facebook</a>
                <button onclick="copyLink()" class="s-btn copy">🔗 Copy Personal Link</button>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let currentName = params.get('name') || "Friend";
        document.getElementById('nameHeading').innerText = currentName;

        // Auto-celebrate on load
        window.onload = () => {
            setTimeout(celebrate, 500);
        };

        function celebrate() {
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#FF007A', '#00D4FF', '#FFD700']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#FF007A', '#00D4FF', '#FFD700']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function getLink(name) {
            const url = new URL(window.location.href);
            url.searchParams.set('name', name || "Friend");
            return url.toString();
        }

        function copyLink() {
            const name = document.getElementById('nameInput').value || currentName;
            navigator.clipboard.writeText(getLink(name));
            alert("✨ Link copied for " + (name || "you") + "!");
        }

        // Dynamic share update
        document.getElementById('nameInput').addEventListener('input', (e) => {
            const name = e.target.value || "Friend";
            const link = getLink(name);
            const text = encodeURIComponent(`🌈 Holi wishes from ${name}! Open your gift here: `);
            document.getElementById('wa').href = `https://api.whatsapp.com/send?text=${text}${encodeURIComponent(link)}`;
            document.getElementById('fb').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`;
        });

        // Initialize links
        document.getElementById('nameInput').dispatchEvent(new Event('input'));
    </script>
</body>
</html>
