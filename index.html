<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Holi Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ff6a00,#ee0979,#00c9ff);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

@keyframes bg{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(15px);
  padding:30px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:420px;
  box-shadow:0 15px 40px rgba(0,0,0,0.4);
  color:white;
  position:relative;
  z-index:2;
}

/* Neon 3D Text */
h1{
  font-size:30px;
  text-shadow:0 0 10px #fff,0 0 20px #ff00de,0 0 40px #ff00de;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{text-shadow:0 0 10px #fff,0 0 20px #ff00de;}
  to{text-shadow:0 0 20px #fff,0 0 40px #00fff7;}
}

input{
  padding:10px;
  width:90%;
  border:none;
  border-radius:8px;
  margin-bottom:10px;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  margin:5px;
  cursor:pointer;
  color:white;
}

.generate{background:#ff9800;}
.whatsapp{background:#25D366;}
.facebook{background:#1877F2;}
.instagram{background:#E1306C;}

.visitor{font-size:14px;margin:10px 0;}

/* Floating Music Button */
.music-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff0080;
  border-radius:50%;
  width:55px;
  height:55px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  color:white;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
  z-index:3;
}

/* Elegant Fireworks */
canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  z-index:1;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="card">

<h1 id="wishText">🌈 Happy Holi 🎉</h1>

<input type="text" id="nameInput" placeholder="Enter Your Name">
<br>
<button class="generate" onclick="generateWish()">Generate Wish</button>

<div class="visitor" id="visitorCount"></div>

<h3>Share Your Wish</h3>

<a id="whatsappShare" target="_blank">
<button class="whatsapp">WhatsApp</button>
</a>

<a id="facebookShare" target="_blank">
<button class="facebook">Facebook</button>
</a>

<button class="instagram" onclick="copyLink()">Instagram</button>

</div>

<div class="music-btn" onclick="toggleMusic()">🎵</div>

<audio id="bgMusic" loop>
<source src="https://cdn.pixabay.com/download/audio/2023/02/14/audio_6f6b6f3f52.mp3?filename=indian-festival-138859.mp3" type="audio/mp3">
</audio>

<script>

/* Auto Name System */
window.onload=function(){
  const params=new URLSearchParams(window.location.search);
  const name=params.get("name");
  if(name){
    document.getElementById("wishText").innerHTML=
    "🌈 Happy Holi from "+name+" 🎉";
  }
  updateShareLinks();
};

/* Generate Wish */
function generateWish(){
  var name=document.getElementById("nameInput").value;
  if(name!=""){
    document.getElementById("wishText").innerHTML=
    "🌈 Happy Holi from "+name+" 🎉";

    var newURL=window.location.origin+
    window.location.pathname+
    "?name="+encodeURIComponent(name);

    window.history.replaceState({},'',newURL);
    updateShareLinks();
  }
}

/* Visitor Counter */
if(localStorage.visits){
  localStorage.visits=Number(localStorage.visits)+1;
}else{
  localStorage.visits=1;
}
document.getElementById("visitorCount").innerHTML=
"Total Visitors: "+localStorage.visits;

/* Share */
function updateShareLinks(){
  var pageUrl=window.location.href;
  var message="🌈 Happy Holi! 🎉 See this wish: "+pageUrl;

  document.getElementById("whatsappShare").href=
  "https://wa.me/?text="+encodeURIComponent(message);

  document.getElementById("facebookShare").href=
  "https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(pageUrl);
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied!");
}

/* Music Toggle */
var music=document.getElementById("bgMusic");
function toggleMusic(){
  if(music.paused){
    music.play();
  }else{
    music.pause();
  }
}

/* Elegant Fireworks */
var canvas=document.getElementById("fireworks");
var ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function firework(){
  var x=Math.random()*canvas.width;
  var y=Math.random()*canvas.height/2;
  for(var i=0;i<20;i++){
    ctx.beginPath();
    ctx.arc(x+Math.random()*80-40,y+Math.random()*80-40,2,0,Math.PI*2);
    ctx.fillStyle="hsl("+Math.random()*360+",100%,60%)";
    ctx.fill();
  }
}
setInterval(firework,1000);

</script>

</body>
  </html>
